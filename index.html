    <script>
      (function () {
        const STORAGE_KEY = 'mandoub_weekly_data';
        const DAYS_COUNT = 7; // الصفوف 3 إلى 9
        const ARABIC_MONTHS = [
          'يناير',
          'فبراير',
          'مارس',
          'أبريل',
          'مايو',
          'يونيو',
          'يوليو',
          'أغسطس',
          'سبتمبر',
          'أكتوبر',
          'نوفمبر',
          'ديسمبر',
        ];

        const tbody = document.getElementById('table-body');
        const statusMsg = document.getElementById('status-msg');
        const btnExport = document.getElementById('btn-export');
        const btnExportPdf = document.getElementById('btn-export-pdf');
        const btnClear = document.getElementById('btn-clear');

        let branchInput = null;
        let nameInput = null;
        let unifyShiftBtn = null;
        let unifyTimeBtn = null;
        let seqDateBtn = null;
        let unifyAmountBtn = null;
        let activeUnifyRowIndex = 0;
        let activeUnifyColumn = 'shift';
        const rows = [];

        function saveTableData() {
          try {
            const payload = {
              branch: branchInput ? branchInput.value : '',
              name: nameInput ? nameInput.value : '',
              rows: rows.map(function (r) {
                return {
                  shift: r.shiftSelect.value,
                  amount: r.amountInput.value,
                  date: r.dateInput.value,
                  from: {
                    hour: r.from.hourInput.value,
                    minute: r.from.minInput.value,
                    period: r.from.periodSelect.value,
                  },
                  to: {
                    hour: r.to.hourInput.value,
                    minute: r.to.minInput.value,
                    period: r.to.periodSelect.value,
                  },
                  orders: r.ordersInput.value,
                  absent: r.absentCheckbox.checked,
                };
              }),
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          } catch (_) {
            // تجاهل أخطاء مساحة التخزين المحلية
          }
        }

        function updateDateDisplay(rowObj) {
          const formatted = formatArabicDate(rowObj.dateInput.value);
          if (formatted) {
            rowObj.dateDisplay.textContent = formatted;
            rowObj.dateDisplay.className =
              'absent-strike-target text-sm text-slate-900 font-medium whitespace-nowrap select-none';
          } else {
            rowObj.dateDisplay.textContent = 'اختر التاريخ';
            rowObj.dateDisplay.className =
              'absent-strike-target text-sm text-slate-400 whitespace-nowrap select-none';
          }
        }

        function loadTableData() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') return;

            if (branchInput && typeof parsed.branch === 'string') {
              branchInput.value = parsed.branch;
            }
            if (nameInput && typeof parsed.name === 'string') {
              nameInput.value = parsed.name;
            }

            if (Array.isArray(parsed.rows)) {
              for (let i = 0; i < DAYS_COUNT && i < parsed.rows.length; i++) {
                const saved = parsed.rows[i];
                const r = rows[i];
                if (!saved || !r) continue;

                if (saved.shift === '120*7' || saved.shift === '70*5' || saved.shift === '') {
                  r.shiftSelect.value = saved.shift;
                }
                if (saved.amount !== undefined && saved.amount !== null) {
                  r.amountInput.value = String(saved.amount);
                } else {
                  applyShiftAmount(i);
                }
                if (typeof saved.date === 'string') {
                  r.dateInput.value = saved.date;
                  updateDateDisplay(r);
                }
                if (saved.from) {
                  r.from.hourInput.value = saved.from.hour || '';
                  r.from.minInput.value = saved.from.minute || '00';
                  if (saved.from.period === 'صباحًا' || saved.from.period === 'مساءً') {
                    r.from.periodSelect.value = saved.from.period;
                  }
                }
                if (saved.to) {
                  r.to.hourInput.value = saved.to.hour || '';
                  r.to.minInput.value = saved.to.minute || '00';
                  if (saved.to.period === 'صباحًا' || saved.to.period === 'مساءً') {
                    r.to.periodSelect.value = saved.to.period;
                  }
                }
                if (saved.orders !== undefined && saved.orders !== null) {
                  r.ordersInput.value = String(saved.orders);
                }
                if (saved.absent === true) {
                  r.absentCheckbox.checked = true;
                  applyAbsentState(i, true, false);
                } else {
                  updateSurplusForRow(i);
                }
              }
              updateTotals();
            }
          } catch (_) {
            // تجاهل البيانات غير الصالحة في localStorage
          }
        }

        function clearTableData() {
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (_) {
            // تجاهل
          }

          if (branchInput) branchInput.value = '';
          if (nameInput) nameInput.value = '';
          if (unifyShiftBtn) unifyShiftBtn.textContent = 'توحيد';
          if (unifyAmountBtn) unifyAmountBtn.textContent = 'توحيد';
          if (unifyTimeBtn) unifyTimeBtn.textContent = 'توحيد';

          for (let i = 0; i < DAYS_COUNT; i++) {
            const r = rows[i];
            r.absentCheckbox.checked = false;
            r.prevAmount = null;
            r.prevOrders = null;
            applyAbsentState(i, false, false);
            r.shiftSelect.value = '';
            r.amountInput.value = '';
            r.dateInput.value = '';
            updateDateDisplay(r);
            r.from.hourInput.value = '';
            r.from.minInput.value = '00';
            r.from.periodSelect.value = 'صباحًا';
            r.to.hourInput.value = '';
            r.to.minInput.value = '00';
            r.to.periodSelect.value = 'صباحًا';
            r.ordersInput.value = '';
            updateSurplusForRow(i);
          }

          updateTotals();
          statusMsg.textContent = 'تم تفريغ الجدول ومسح البيانات المحفوظة.';
        }

        function formatArabicDate(isoValue) {
          if (!isoValue) return '';
          const parts = isoValue.split('-');
          if (parts.length !== 3) return '';
          const monthIdx = parseInt(parts[1], 10) - 1;
          const day = parseInt(parts[2], 10);
          if (Number.isNaN(day) || monthIdx < 0 || monthIdx > 11) return '';
          return day + '، ' + ARABIC_MONTHS[monthIdx];
        }

        function computeAmount(shiftValue) {
          if (shiftValue === '120*7') return '120';
          if (shiftValue === '70*5') return '70';
          return '';
        }

        function computeSurplus(shiftValue, ordersRaw) {
          if (shiftValue !== '120*7' && shiftValue !== '70*5') {
            return 0;
          }
          if (ordersRaw === '' || ordersRaw === null || ordersRaw === undefined) {
            return 0;
          }
          const orders = Number(ordersRaw);
          if (!Number.isFinite(orders) || orders <= 0) {
            return 0;
          }
          const threshold = shiftValue === '70*5' ? 5 : 15;
          return orders > threshold ? orders - threshold : 0;
        }

        function applyShiftAmount(rowIndex) {
          const r = rows[rowIndex];
          if (r.absentCheckbox && r.absentCheckbox.checked) {
            r.amountInput.value = '0';
            return;
          }

          const baseAmount = Number(computeAmount(r.shiftSelect.value)) || 0;
          const surplusCount = computeSurplus(r.shiftSelect.value, r.ordersInput.value);
          const surplusRate = r.shiftSelect.value === '120*7' ? 7 : (r.shiftSelect.value === '70*5' ? 5 : 0);
          const finalAmount = baseAmount + surplusCount * surplusRate;
          r.amountInput.value = r.shiftSelect.value ? String(finalAmount) : '';
        }

        function updateSurplusForRow(rowIndex) {
          const r = rows[rowIndex];
          if (r.absentCheckbox && r.absentCheckbox.checked) {
            r.surplusInput.value = '0';
            return;
          }
          r.surplusInput.value = computeSurplus(r.shiftSelect.value, r.ordersInput.value);
        }

        function applyAbsentState(rowIndex, isAbsent, shouldSave) {
          const r = rows[rowIndex];
          if (!r) return;

          if (isAbsent) {
            if (r.absentMergeLeftTd.parentNode !== r.tr) {
              r.tr.insertBefore(r.absentMergeLeftTd, r.shiftTd);
              r.tr.removeChild(r.shiftTd);
              r.tr.removeChild(r.amountTd);
            }
            if (r.absentMergeRightTd.parentNode !== r.tr) {
              r.tr.insertBefore(r.absentMergeRightTd, r.fromTd);
              r.tr.removeChild(r.fromTd);
              r.tr.removeChild(r.toTd);
              r.tr.removeChild(r.ordersTd);
              r.tr.removeChild(r.surplusTd);
            }
          } else {
            if (r.absentMergeLeftTd.parentNode === r.tr) {
              r.tr.insertBefore(r.shiftTd, r.absentMergeLeftTd);
              r.tr.insertBefore(r.amountTd, r.absentMergeLeftTd);
              r.tr.removeChild(r.absentMergeLeftTd);
            }
            if (r.absentMergeRightTd.parentNode === r.tr) {
              r.tr.insertBefore(r.fromTd, r.absentMergeRightTd);
              r.tr.insertBefore(r.toTd, r.absentMergeRightTd);
              r.tr.insertBefore(r.ordersTd, r.absentMergeRightTd);
              r.tr.insertBefore(r.surplusTd, r.absentMergeRightTd);
              r.tr.removeChild(r.absentMergeRightTd);
            }
          }

          updateTotals();
          if (shouldSave !== false) {
            saveTableData();
          }
        }

        function updateTotals() {
          let totalAmount = 0;
          let totalOrders = 0;
          let totalSurplus = 0;

          for (let i = 0; i < DAYS_COUNT; i++) {
            const r = rows[i];
            if (r.absentCheckbox && r.absentCheckbox.checked) {
              continue;
            }
            totalAmount += Number(r.amountInput.value) || 0;
            const ordersVal = Number(r.ordersInput.value);
            if (r.ordersInput.value !== '' && Number.isFinite(ordersVal)) {
              totalOrders += ordersVal;
            }
            totalSurplus += Number(r.surplusInput.value) || 0;
          }

          const totalAmountValue = document.getElementById('total-amount-value');
          if (totalAmountValue) totalAmountValue.textContent = totalAmount;
          else document.getElementById('total-amount').textContent = totalAmount;
          document.getElementById('total-orders').textContent = totalOrders;
          document.getElementById('total-surplus').textContent = totalSurplus;
        }

        function createTimeControls(rowIndex, sideLabel) {
          const wrap = document.createElement('div');
          // الترتيب المطلوب من اليسار لليمين: الساعة (يسار) -> الدقيقة (وسط) -> صباحًا/مساءً (يمين)
          wrap.dir = 'ltr';
          wrap.className = 'flex items-center justify-center gap-1';

          const hourInput = document.createElement('input');
          hourInput.type = 'number';
          hourInput.min = '1';
          hourInput.max = '12';

        function fillDatesSequentially() {
          const firstIso = rows[0] ? rows[0].dateInput.value : '';
          if (!firstIso) {
            statusMsg.textContent = 'يرجى اختيار تاريخ الصف الأول أولاً لتعبئة باقي الأيام تسلسليًا.';
            if (rows[0] && rows[0].dateWrap) {
              rows[0].dateWrap.focus();
            }
            return;
          }

          const parts = firstIso.split('-');
          if (parts.length !== 3) return;
          const baseYear = parseInt(parts[0], 10);
          const baseMonth = parseInt(parts[1], 10) - 1;
          const baseDay = parseInt(parts[2], 10);

          for (let i = 1; i < DAYS_COUNT; i++) {
            const nextDate = new Date(baseYear, baseMonth, baseDay + i);
            rows[i].dateInput.value = toIsoDate(
              nextDate.getFullYear(),
              nextDate.getMonth(),
              nextDate.getDate()
            );
            updateDateDisplay(rows[i]);
          }

          saveTableData();
          statusMsg.textContent = 'تمت تعبئة التواريخ تسلسليًا لجميع أيام الأسبوع.';
        }

        function getUnifyStartRow() {
          return Math.max(0, Math.min(DAYS_COUNT - 1, activeUnifyRowIndex));
        }

        function unifyShiftColumn() {
          const start = getUnifyStartRow();
          const source = rows[start];
          if (!source || source.absentCheckbox.checked || !source.shiftSelect.value) {
            statusMsg.textContent = 'اختر خلية دوام تحتوي على قيمة في يوم غير غياب أولاً.';
            return;
          }
          const value = source.shiftSelect.value;
          for (let i = start; i < DAYS_COUNT; i++) {
            const r = rows[i];
            if (r.absentCheckbox.checked) continue;
            r.shiftSelect.value = value;
            applyShiftAmount(i);
            updateSurplusForRow(i);
          }
          updateTotals();
          saveTableData();
          unifyShiftBtn.textContent = 'توحيد ✓';
          statusMsg.textContent = 'تم توحيد الدوام من اليوم المحدد حتى نهاية الأسبوع، مع تخطي أيام الغياب.';
        }

        function unifyAmountColumn() {
          const start = getUnifyStartRow();
          const source = rows[start];
          if (!source || source.absentCheckbox.checked || source.amountInput.value === '') {
            statusMsg.textContent = 'اختر خلية مبلغ تحتوي على قيمة في يوم غير غياب أولاً.';
            return;
          }
          const value = source.amountInput.value;
          for (let i = start; i < DAYS_COUNT; i++) {
            const r = rows[i];
            if (r.absentCheckbox.checked) continue;
            r.amountInput.value = value;
          }
          updateTotals();
          saveTableData();
          unifyAmountBtn.textContent = 'توحيد ✓';
          statusMsg.textContent = 'تم توحيد المبلغ من اليوم المحدد حتى نهاية الأسبوع، مع تخطي أيام الغياب.';
        }

        function unifyTimeColumns() {
          const start = getUnifyStartRow();
          const side = activeUnifyColumn === 'to' ? 'to' : 'from';
          const source = rows[start];
          if (!source || source.absentCheckbox.checked) {
            statusMsg.textContent = 'اختر خلية وقت في يوم غير غياب أولاً.';
            return;
          }
          const ctrl = source[side];
          if (!ctrl.hourInput.value.trim()) {
            statusMsg.textContent = 'أدخل الساعة في الخلية المحددة أولاً ثم اضغط توحيد.';
            return;
          }
          const value = { hour: ctrl.hourInput.value, minute: ctrl.minInput.value || '00', period: ctrl.periodSelect.value };
          for (let i = start; i < DAYS_COUNT; i++) {
            const r = rows[i];
            if (r.absentCheckbox.checked) continue;
            r[side].hourInput.value = value.hour;
            r[side].minInput.value = value.minute;
            r[side].periodSelect.value = value.period;
          }
          saveTableData();
          unifyTimeBtn.textContent = 'توحيد ✓';
          statusMsg.textContent = 'تم توحيد وقت ' + (side === 'from' ? 'الحضور' : 'الانصراف') + ' من اليوم المحدد حتى نهاية الأسبوع، مع تخطي أيام الغياب.';
        }

        function formatTimeForExport(ctrl) {
          const h = ctrl.hourInput.value.trim();
          const m = (ctrl.minInput.value.trim() || '00').padStart(2, '0');
          const p = ctrl.periodSelect.value;
          if (!h) return '';
          return h + ':' + m + ' ' + p;
        }

        async function exportToExcel() {
          if (typeof ExcelJS === 'undefined' || typeof saveAs === 'undefined') {
            statusMsg.textContent =
              'تعذر تحميل مكتبة التصدير (ExcelJS / FileSaver)، يرجى التحقق من الاتصال بالإنترنت.';
            return;
          }

          const branchVal = branchInput ? branchInput.value.trim() : '';
          const nameVal = nameInput ? nameInput.value.trim() : '';

          const workbook = new ExcelJS.Workbook();
          const worksheet = workbook.addWorksheet('الراتب الأسبوعي', {
            views: [{ rightToLeft: true }],
          });

          worksheet.columns = [
            { width: 16 },
            { width: 18 },
            { width: 12 },
            { width: 12 },
            { width: 16 },
            { width: 16 },
            { width: 16 },
            { width: 14 },
            { width: 12 },
          ];

          // الصف 1: العناوين الرئيسية
          worksheet.getRow(1).values = [
            'الفرع',
            'الاسم',
            'الدوام',
            'المبلغ',
            'التاريخ',
            'وقت الحضور والانصراف',
            '',
            'عدد الطلبات',
            'الفائض',
          ];

          // الصف 2: الصف الفرعي لوقت الحضور والانصراف
          worksheet.getRow(2).values = ['', '', '', '', '', 'من', 'إلى', '', ''];

          // الصفوف 3 إلى 9: أيام الأسبوع السبعة
          for (let i = 0; i < DAYS_COUNT; i++) {
            const r = rows[i];
            const dateText = formatArabicDate(r.dateInput.value);

            if (r.absentCheckbox.checked) {
              worksheet.getRow(i + 3).values = [
                i === 0 ? branchVal : '',
                i === 0 ? nameVal : '',
                'غياب',
                '',
                dateText,
                'غياب',
                '',
                '',
                '',
              ];
            } else {
              const ordersNum = r.ordersInput.value === '' ? 0 : Number(r.ordersInput.value) || 0;
              const amountNum = Number(r.amountInput.value) || 0;
              const surplusNum = Number(r.surplusInput.value) || 0;

              worksheet.getRow(i + 3).values = [
                i === 0 ? branchVal : '',
                i === 0 ? nameVal : '',
                r.shiftSelect.value,
                amountNum,
                dateText,
                formatTimeForExport(r.from),
                formatTimeForExport(r.to),
                ordersNum,
                surplusNum,
              ];
            }
          }

          // الصف 10: الإجمالي الأسبوعي
          worksheet.getRow(10).values = [
            '',
            '',
            '',
            Number((document.getElementById('total-amount-value') || document.getElementById('total-amount')).textContent) || 0,
            'الإجمالي الأسبوعي',
            '',
            '',
            Number(document.getElementById('total-orders').textContent) || 0,
            Number(document.getElementById('total-surplus').textContent) || 0,
          ];

          // دمج خلايا العناوين ودمج عمودي الفرع والاسم عبر الصفوف 3-10
          worksheet.mergeCells('A1:A2');
          worksheet.mergeCells('B1:B2');
          worksheet.mergeCells('C1:C2');
          worksheet.mergeCells('D1:D2');
          worksheet.mergeCells('E1:E2');
          worksheet.mergeCells('F1:G1');
          worksheet.mergeCells('H1:H2');
          worksheet.mergeCells('I1:I2');
          worksheet.mergeCells('A3:A10');
          worksheet.mergeCells('B3:B10');

          // دمج خلايا صفوف الغياب في Excel بنفس شكل الجدول
          for (let i = 0; i < DAYS_COUNT; i++) {
            if (rows[i].absentCheckbox.checked) {
              const excelRow = i + 3;
              worksheet.mergeCells('C' + excelRow + ':D' + excelRow);
              worksheet.mergeCells('F' + excelRow + ':I' + excelRow);
            }
          }

          const thinGrayBorder = {
            top: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            left: { style: 'thin', color: { argb: 'FFD1D5DB' } },
            right: { style: 'thin', color: { argb: 'FFD1D5DB' } },
          };

          const headerFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FF1E293B' },
          };

          const headerFont = {
            name: 'Tajawal',
            size: 11,
            bold: true,
            color: { argb: 'FFFFFFFF' },
          };

          const totalHighlightFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFEF08A' },
          };

          const absentRowFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFCA5A5' },
          };

          const calculatedTotalCols = new Set([4, 8, 9]);

          for (let rowNum = 1; rowNum <= 10; rowNum++) {
            const row = worksheet.getRow(rowNum);
            row.height = rowNum <= 2 ? 24 : 22;
            const isAbsentRow =
              rowNum >= 3 &&
              rowNum <= 9 &&
              rows[rowNum - 3] &&
              rows[rowNum - 3].absentCheckbox.checked;

            for (let colNum = 1; colNum <= 9; colNum++) {
              const cell = row.getCell(colNum);
              cell.border = thinGrayBorder;
              cell.alignment = { horizontal: 'center', vertical: 'middle' };

              if (rowNum === 1 || rowNum === 2) {
                cell.fill = headerFill;
                cell.font = headerFont;
              } else if (rowNum === 10) {
                if (calculatedTotalCols.has(colNum)) {
                  cell.fill = totalHighlightFill;
                  cell.font = {
                    name: 'Tajawal',
                    size: 11,
                    bold: true,
                    color: { argb: 'FF0F172A' },
                  };
                } else {
                  cell.font = {
                    name: 'Tajawal',
                    size: 11,
                    bold: colNum === 5,
                    color: { argb: 'FF334155' },
                  };
                }
              } else if (isAbsentRow && colNum >= 3 && colNum !== 5) {
                cell.fill = absentRowFill;
                cell.font = {
                  name: 'Tajawal',
                  size: 11,
                  bold: true,
                  color: { argb: 'FF7F1D1D' },
                };
              } else {
                cell.font = {
                  name: 'Tajawal',
                  size: 11,
                  color: { argb: 'FF0F172A' },
                };
              }
            }
          }

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          });

          const repName = nameVal
            ? nameVal.replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_')
            : 'مندوب';
          const dateTag = new Date().toISOString().slice(0, 10);
          saveAs(blob, 'الراتب_الأسبوعي_' + repName + '_' + dateTag + '.xlsx');
          statusMsg.textContent = 'تم تصدير الجدول إلى ملف Excel بنجاح.';
        }

        async function exportToPdf() {
          if (typeof html2canvas === 'undefined' || !window.jspdf || !window.jspdf.jsPDF) {
            statusMsg.textContent =
              'تعذر تحميل مكتبة التصدير (jsPDF / html2canvas)، يرجى التحقق من الاتصال بالإنترنت.';
            return;
          }

          const tableEl = document.getElementById('salary-table');
          if (!tableEl) return;

          btnExportPdf.disabled = true;
          statusMsg.textContent = 'جاري تجهيز ملف PDF...';

          const noPrintEls = Array.from(tableEl.querySelectorAll('.no-print'));

          try {
            closeDatePicker();

            if (document.fonts && document.fonts.ready) {
              await document.fonts.ready;
            }

            // إخفاء جميع عناصر التحكم التفاعلية (.no-print: أزرار توحيد، تعبئة تسلسلية، وخيار غياب) مؤقتًا قبل الالتقاط
            noPrintEls.forEach(function (el) {
              el.style.display = 'none';
            });

            const origControls = Array.from(tableEl.querySelectorAll('input, select'));
            const controlValues = origControls.map(function (el) {
              if (el.tagName === 'SELECT') {
                return el.options[el.selectedIndex] ? el.options[el.selectedIndex].textContent : '';
              }
              return el.value;
            });

            const canvas = await html2canvas(tableEl, {
              scale: 3,
              useCORS: true,
              backgroundColor: '#ffffff',
              scrollX: 0,
              scrollY: 0,
              onclone: function (clonedDoc) {
                const clonedTable = clonedDoc.getElementById('salary-table');
                if (!clonedTable) return;

                // التأكد من عدم اقتصاص الجدول أفقياً على الشاشات الصغيرة
                const wrapper = clonedTable.parentElement;
                if (wrapper) {
                  wrapper.style.overflow = 'visible';
                  wrapper.style.width = 'max-content';
                }

                // تثبيت حدود الخلايا الداكنة الواضحة داخل نسخة الـ PDF
                clonedTable.style.borderCollapse = 'collapse';

                // منع تداخل خلفية أي صف <tr> مع خلايا rowspan (في الرأس والجسم)
                const allRows = clonedTable.querySelectorAll('thead tr, tbody tr');
                allRows.forEach(function (tr) {
                  tr.style.backgroundColor = 'transparent';
                });

                // تعزيز وضوح نص صف العناوين الداكن في الصورة الملتقطة
                const headerCells = clonedTable.querySelectorAll('thead th');
                headerCells.forEach(function (th) {
                  th.style.backgroundColor = '#1e293b';
                  th.style.color = '#ffffff';
                  th.style.fontWeight = '700';
                  th.style.opacity = '1';
                  th.style.border = '1px solid #4b5563';
                  th.style.paddingTop = '12px';
                  th.style.paddingBottom = '12px';
                });

                // زيادة المساحة الرأسية للصفوف وتثبيت الحدود لكل خلايا الجسم (بما فيها خلايا rowspan)
                const bodyCells = clonedTable.querySelectorAll('tbody td');
                bodyCells.forEach(function (td) {
                  td.style.border = '1px solid #4b5563';
                  td.style.borderRadius = '0';
                  td.style.paddingTop = '13px';
                  td.style.paddingBottom = '13px';
                  if (td.hasAttribute('rowspan')) {
                    td.style.backgroundColor = 'transparent';
                  }
                  if (td.classList.contains('absent-merged-cell')) {
                    td.style.backgroundColor = '#fca5a5';
                  }
                });

                // استبدال حقول الإدخال والقوائم المنسدلة بنصوص ثابتة واضحة أثناء التصوير
                const clonedControls = Array.from(clonedTable.querySelectorAll('input, select'));
                clonedControls.forEach(function (el, idx) {
                  if (el.type === 'date') {
                    el.style.display = 'none';
                    return;
                  }
                  if (el.type === 'checkbox') {
                    return;
                  }
                  const span = clonedDoc.createElement('span');
                  span.textContent = controlValues[idx] || '';
                  if (el.dir) span.dir = el.dir;
                  span.className = el.className;
                  span.style.display = 'inline-block';
                  span.style.minHeight = '24px';
                  span.style.lineHeight = '24px';
                  span.style.borderColor = 'transparent';
                  span.style.backgroundColor = 'transparent';
                  el.parentNode.replaceChild(span, el);
                });
              },
            });

            // إعادة إظهار عناصر .no-print فورًا بعد الالتقاط
            noPrintEls.forEach(function (el) {
              el.style.display = '';
            });

            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
              orientation: 'landscape',
              unit: 'mm',
              format: 'a4',
            });

            const pageWidth = pdf.internal.pageSize.getWidth(); // 297mm
            const pageHeight = pdf.internal.pageSize.getHeight(); // 210mm
            const margin = 6;
            const maxWidth = pageWidth - margin * 2;
            const maxHeight = pageHeight - margin * 2;
            const imgAspectRatio = canvas.width / canvas.height;

            let renderWidth = maxWidth;
            let renderHeight = renderWidth / imgAspectRatio;

            if (renderHeight > maxHeight) {
              renderHeight = maxHeight;
              renderWidth = renderHeight * imgAspectRatio;
            }

            const offsetX = (pageWidth - renderWidth) / 2;
            const offsetY = (pageHeight - renderHeight) / 2;

            pdf.addImage(imgData, 'PNG', offsetX, offsetY, renderWidth, renderHeight);

            const nameVal = nameInput ? nameInput.value.trim() : '';
            const repName = nameVal
              ? nameVal.replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_')
              : 'مندوب';
            const dateTag = new Date().toISOString().slice(0, 10);
            pdf.save('الراتب_الأسبوعي_' + repName + '_' + dateTag + '.pdf');
            statusMsg.textContent = 'تم تصدير الجدول إلى ملف PDF بنجاح.';
          } catch (_) {
            statusMsg.textContent = 'حدث خطأ أثناء إنشاء ملف PDF، يرجى المحاولة مرة أخرى.';
          } finally {
            noPrintEls.forEach(function (el) {
              el.style.display = '';
            });
            btnExportPdf.disabled = false;
          }
        }

        // منطق منتقي التاريخ العام المتوافق مع MacBook Air M2 وكل الأجهزة والمتصفحات
        const datePopover = document.getElementById('date-picker-popover');
        const dpMonthYear = document.getElementById('dp-month-year');
        const dpDaysGrid = document.getElementById('dp-days-grid');
        const dpPrevBtn = document.getElementById('dp-prev-month');
        const dpNextBtn = document.getElementById('dp-next-month');
        const dpTodayBtn = document.getElementById('dp-today-btn');
        const dpClearBtn = document.getElementById('dp-clear-btn');

        let activeDateRowIdx = null;
        let dpViewYear = new Date().getFullYear();
        let dpViewMonth = new Date().getMonth();

        function toIsoDate(year, monthIndex, day) {
          return (
            year +
            '-' +
            String(monthIndex + 1).padStart(2, '0') +
            '-' +
            String(day).padStart(2, '0')
          );
        }

        function renderDatePickerGrid() {
          dpMonthYear.textContent = ARABIC_MONTHS[dpViewMonth] + ' ' + dpViewYear;
          dpDaysGrid.innerHTML = '';

          const firstWeekday = new Date(dpViewYear, dpViewMonth, 1).getDay();
          const daysInMonth = new Date(dpViewYear, dpViewMonth + 1, 0).getDate();

          const selectedIso =
            activeDateRowIdx !== null && rows[activeDateRowIdx]
              ? rows[activeDateRowIdx].dateInput.value
              : '';
          const today = new Date();
          const todayIso = toIsoDate(today.getFullYear(), today.getMonth(), today.getDate());

          for (let blank = 0; blank < firstWeekday; blank++) {
            const emptyCell = document.createElement('span');
            dpDaysGrid.appendChild(emptyCell);
          }

          for (let d = 1; d <= daysInMonth; d++) {
            const cellIso = toIsoDate(dpViewYear, dpViewMonth, d);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = String(d);

            const isSelected = cellIso === selectedIso;
            const isToday = cellIso === todayIso;

            let cls = 'py-1.5 rounded text-sm cursor-pointer ';
            if (isSelected) {
              cls += 'bg-blue-600 text-white font-bold';
            } else if (isToday) {
              cls += 'border border-blue-500 text-blue-700 font-bold hover:bg-blue-50';
            } else {
              cls += 'text-slate-800 hover:bg-gray-100';
            }
            btn.className = cls;

            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              if (activeDateRowIdx !== null && rows[activeDateRowIdx]) {
                rows[activeDateRowIdx].dateInput.value = cellIso;
                updateDateDisplay(rows[activeDateRowIdx]);
                saveTableData();
              }
              closeDatePicker();
            });

            dpDaysGrid.appendChild(btn);
          }
        }

        function positionDatePicker(anchorEl) {
          const rect = anchorEl.getBoundingClientRect();
          const popWidth = 288;
          const popHeight = datePopover.offsetHeight || 280;

          let left = rect.left + rect.width / 2 - popWidth / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - popWidth - 8));

          let top = rect.bottom + 6;
          if (top + popHeight > window.innerHeight - 8) {
            top = Math.max(8, rect.top - popHeight - 6);
          }

          datePopover.style.left = left + 'px';
          datePopover.style.top = top + 'px';
        }

        function openDatePicker(rowIndex, anchorEl) {
          activeDateRowIdx = rowIndex;
          const currentVal = rows[rowIndex] ? rows[rowIndex].dateInput.value : '';
          if (currentVal) {
            const parts = currentVal.split('-');
            if (parts.length === 3) {
              const y = parseInt(parts[0], 10);
              const m = parseInt(parts[1], 10) - 1;
              if (!Number.isNaN(y) && !Number.isNaN(m) && m >= 0 && m <= 11) {
                dpViewYear = y;
                dpViewMonth = m;
              }
            }
          } else {
            const now = new Date();
            dpViewYear = now.getFullYear();
            dpViewMonth = now.getMonth();
          }

          renderDatePickerGrid();
          datePopover.classList.remove('hidden');
          positionDatePicker(anchorEl);
        }

        function closeDatePicker() {
          datePopover.classList.add('hidden');
          activeDateRowIdx = null;
        }

        datePopover.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        dpPrevBtn.addEventListener('click', function () {
          dpViewMonth -= 1;
          if (dpViewMonth < 0) {
            dpViewMonth = 11;
            dpViewYear -= 1;
          }
          renderDatePickerGrid();
        });

        dpNextBtn.addEventListener('click', function () {
          dpViewMonth += 1;
          if (dpViewMonth > 11) {
            dpViewMonth = 0;
            dpViewYear += 1;
          }
          renderDatePickerGrid();
        });

        dpTodayBtn.addEventListener('click', function () {
          if (activeDateRowIdx !== null && rows[activeDateRowIdx]) {
            const now = new Date();
            rows[activeDateRowIdx].dateInput.value = toIsoDate(
              now.getFullYear(),
              now.getMonth(),
              now.getDate()
            );
            updateDateDisplay(rows[activeDateRowIdx]);
            saveTableData();
          }
          closeDatePicker();
        });

        dpClearBtn.addEventListener('click', function () {
          if (activeDateRowIdx !== null && rows[activeDateRowIdx]) {
            rows[activeDateRowIdx].dateInput.value = '';
            updateDateDisplay(rows[activeDateRowIdx]);
            saveTableData();
          }
          closeDatePicker();
        });

        document.addEventListener('click', function () {
          if (!datePopover.classList.contains('hidden')) {
            closeDatePicker();
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !datePopover.classList.contains('hidden')) {
            closeDatePicker();
          }
        });

        btnExport.addEventListener('click', exportToExcel);
        btnExportPdf.addEventListener('click', exportToPdf);
        btnClear.addEventListener('click', clearTableData);

        function initApp() {
          buildTable();
          loadTableData();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initApp);
        } else {
          initApp();
        }
      })();
    </script>
  </body>
</html>
